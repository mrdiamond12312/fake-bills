# Flat node_modules so the api route's runtime createRequire('satori'/'@resvg/resvg-js')
# resolves and gets bundled on Vercel (pnpm's default symlinked layout hides them).
nodeLinker: hoisted
allowBuilds:
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: true
  '@parcel/watcher': true
  cypress: false
  '@swc/core': true
  unrs-resolver: true
overrides:
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
